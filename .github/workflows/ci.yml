name: C++ CI and Web Dashboard Deployment

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Compile C++ project
        run: |
          g++ -std=c++17 -O2 -Wall -Wextra -pthread -o traffic_sim \
            src/graph.cpp src/dijkstra.cpp src/astar.cpp src/simulation.cpp \
            src/assignment.cpp src/alerts.cpp src/incidents.cpp \
            src/sensor_feed.cpp src/main.cpp

      - name: Run C++ test suite and generate simulation data
        run: |
          set -o pipefail
          ./traffic_sim 2>&1 | tee output.log
          EXIT_CODE=${PIPESTATUS[0]}
          echo ""
          echo "=========================================="
          echo "Last 40 lines of test output:"
          echo "=========================================="
          tail -n 40 output.log
          exit $EXIT_CODE

      - name: Run Web Logic Unit Tests
        run: |
          node web/test_logic.js

      - name: Upload simulation and assignment data artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: traffic-simulation-artifacts
          path: |
            data/network.json
            data/assignment_result.json
            data/alerts.json
            data/sim_timeseries.json
            web/data.js
          if-no-files-found: warn

  deploy-pages:
    needs: build-and-test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download fresh simulation data from build
        uses: actions/download-artifact@v4
        with:
          name: traffic-simulation-artifacts
          path: temp_artifacts/

      - name: Update web/data.js with fresh simulation output
        run: |
          if [ -f temp_artifacts/web/data.js ]; then
            cp temp_artifacts/web/data.js web/data.js
          elif [ -f temp_artifacts/data.js ]; then
            cp temp_artifacts/data.js web/data.js
          fi

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Web Dashboard Artifact for GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'web/'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
