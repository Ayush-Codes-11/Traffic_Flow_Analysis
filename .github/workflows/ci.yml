name: C++ CI

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compile C++ project
        run: |
          g++ -std=c++17 -O2 -Wall -Wextra -pthread -o traffic_sim \
            src/graph.cpp src/dijkstra.cpp src/astar.cpp src/simulation.cpp \
            src/assignment.cpp src/alerts.cpp src/incidents.cpp \
            src/sensor_feed.cpp src/main.cpp

      - name: Run C++ test suite
        run: |
          set -o pipefail
          ./traffic_sim 2>&1 | tee output.log
          EXIT_CODE=${PIPESTATUS[0]}
          echo ""
          echo "=========================================="
          echo "Last 40 lines of test output:"
          echo "=========================================="
          tail -n 40 output.log
          exit $EXIT_CODE

      - name: Upload simulation and assignment data artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: traffic-simulation-artifacts
          path: |
            data/assignment_result.json
            data/alerts.json
            data/sim_timeseries.json
          if-no-files-found: warn
